<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./style.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

    <title>Battle</title>
  </head>
  <body class="battle-page" onload="onLoad()">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" alt="" width="auto" height="50px" />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-item nav-link" href="index.html">Home</a>
          <a class="nav-item nav-link" href="pokedex.html">Pokedex</a>
          <a class="nav-item nav-link active" href="battle.html">Battle</a>
        </div>
      </div>
    </nav>
    <div class="container d-flex flex-column align-items-center mt-3">
      <h1>Battle!</h1>
    </div>
    <div class="container mt-4">
      <div class="row align-items-center justify-content-center">
        <!-- Pokémon 1 -->
        <div class="col-md-5 text-center">
          <div class="row justify-content-center" id="pokemon-container"></div>
          <button class="btn btn-sm btn-outline-secondary mt-2" onclick="carregarPokemon1()">Change P1</button>
        </div>

        <div class="col-md-2 text-center my-3 my-md-0">
          <h2 class="font-weight-bold">VS</h2>
        </div>

        <!-- Pokémon 2 -->
        <div class="col-md-5 text-center">
          <div class="row justify-content-center" id="pokemon-container2"></div>
          <button class="btn btn-sm btn-outline-secondary mt-2" onclick="carregarPokemon2()">Change P2</button>
        </div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row align-items-center justify-content-center">
        <button class="btn btn-outline-primary" id="new-battle" onclick="onLoad()">NEW BATTLE</button>
      </div>
      <div class="row align-items-center justify-content-center mt-3">
        <button class="btn btn-danger" id="fight-button" onclick="fight()">FIGHT</button>
      </div>
    </div>

    <div class="battle-result"></div>

    <footer class="site-footer">
      <p><strong>API:</strong> <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></p>
      <p>Marta Santos</p>
      <p>Nº136934</p>
      <p>Tecnologias e Desenvolvimento Web</p>
      <p>Mestrado em Comunicação e Tecnologias Web</p>
    </footer>
  </body>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="./bootstrap.min.js"></script>
  <script src="./api.js"></script>
  <script src="./display.js"></script>
  <script src="./battle.js"></script>
</html>
