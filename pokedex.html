<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./style.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <title>Pokedex</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" alt="" width="auto" height="50px" />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-item nav-link" href="index.html">Home</a>
          <a class="nav-item nav-link active" href="pokedex.html">Pokedex</a>
          <a class="nav-item nav-link" href="battle.html">Battle</a>
        </div>
      </div>
    </nav>

    <div class="container d-flex flex-column align-items-center mt-3">
      <h1>Pokedex</h1>
      <form class="container my-4 d-flex align-items-center justify-content-center" style="max-width: 600px">
        <input type="text" id="search-input" class="form-control" placeholder="Search any Pokémon by name or ID..." onkeyup="filterByNameOrId(this.value)" />
        <button class="btn search ml-3" type="submit">
          <i class="bi bi-search"></i>
        </button>
      </form>
    </div>

    <div class="container text-center my-4 d-flex justify-content-center align-items-center">
      <select id="gen-select" class="form-select w-auto" onchange="changeGen(this.value)">
        <option value="1">Generation 1 (Kanto)</option>
        <option value="2">Generation 2 (Johto)</option>
        <option value="3">Generation 3 (Hoenn)</option>
        <option value="4">Generation 4 (Sinnoh)</option>
        <option value="5">Generation 5 (Unova)</option>
        <option value="6">Generation 6 (Kalos)</option>
        <option value="7">Generation 7 (Alola)</option>
        <option value="8">Generation 8 (Galar)</option>
        <option value="9">Generation 9 (Paldea)</option>
      </select>

      <select id="type-select" class="form-select w-auto ml-3" onchange="changeType(this.value)">
        <option value="normal">Normal</option>
        <option value="fire">Fire</option>
        <option value="water">Water</option>
        <option value="grass">Grass</option>
        <option value="electric">Electric</option>
        <option value="ice">Ice</option>
        <option value="fighting">Fighting</option>
        <option value="poison">Poison</option>
        <option value="ground">Ground</option>
        <option value="flying">Flying</option>
        <option value="psychic">Psychic</option>
        <option value="bug">Bug</option>
        <option value="rock">Rock</option>
        <option value="ghost">Ghost</option>
        <option value="dark">Dark</option>
        <option value="steel">Steel</option>
        <option value="fairy">Fairy</option>
      </select>
    </div>

    <div class="container mt-4">
      <div class="row" id="pokedex-grid"></div>
    </div>

    <div class="modal fade" id="pokemonModal" tabindex="-1" role="dialog" aria-labelledby="pokemonModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title font-weight-bold" id="pokemonModalLabel">Pokémon Details</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body" id="modal-body-content"></div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <p><strong>API:</strong> <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></p>
      <p>Marta Santos</p>
      <p>Nº136934</p>
      <p>Tecnologias e Desenvolvimento Web</p>
      <p>Mestrado em Comunicação e Tecnologias Web</p>
    </footer>
  </body>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="./bootstrap.min.js"></script>
  <script src="./pokedex.js"></script>
  <script src="./api.js"></script>
  <script src="./display.js"></script>
</html>
